workflows:
  android-workflow:
    name: All Mayadin Bazaar Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web Production Bundle
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
          if [ -f "android/variables.gradle" ]; then
            perl -i -pe 's/targetSdkVersion\s*=\s*\d+/targetSdkVersion = 35/g' android/variables.gradle
            perl -i -pe 's/compileSdkVersion\s*=\s*\d+/compileSdkVersion = 35/g' android/variables.gradle
          fi
      - name: Build Android AAB and APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Sign Android App Bundle (AAB) and APK
        script: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)

          KEYSTORE="/tmp/release.keystore"
          ALIAS="almayadin"
          PASS="almayadin123"

          if [ -n "$CM_KEYSTORE_PATH" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            KEYSTORE="$CM_KEYSTORE_PATH"
            ALIAS="${CM_KEY_ALIAS:-almayadin}"
            PASS="${CM_KEYSTORE_PASSWORD:-almayadin123}"
          elif [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/release.keystore
            KEYSTORE="/tmp/release.keystore"
            ALIAS="${CM_KEY_ALIAS:-almayadin}"
            PASS="${CM_KEYSTORE_PASSWORD:-almayadin123}"
          else
            echo "Generating production release keystore on the fly..."
            keytool -genkey -v -keystore "$KEYSTORE" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=AlMayadin, OU=Mobile, O=AlMayadinBazaar, L=Dhaka, ST=Dhaka, C=BD"
          fi

          if [ -n "$AAB_FILE" ] && [ -f "$AAB_FILE" ]; then
            echo "Signing AAB: $AAB_FILE"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" "$AAB_FILE" "$ALIAS"
            echo "AAB Successfully Signed!"
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Signing APK: $APK_FILE"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" "$APK_FILE" "$ALIAS"
            echo "APK Successfully Signed!"
          fi
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - free122055@gmail.com
