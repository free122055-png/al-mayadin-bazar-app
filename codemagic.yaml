workflows:
  android-workflow:
    name: All Mayadin Bazaar Android AAB Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web Production Bundle
        script: |
          npm run build
      - name: Sync Capacitor Android
        script: |
          npx cap sync android
          if [ -f "android/variables.gradle" ]; then
            perl -i -pe 's/targetSdkVersion\s*=\s*\d+/targetSdkVersion = 36/g' android/variables.gradle
            perl -i -pe 's/compileSdkVersion\s*=\s*\d+/compileSdkVersion = 36/g' android/variables.gradle
          fi
      - name: Build Android AAB (Google Play Bundle)
        script: |
          cd android
          echo "=== Java Environment ==="
          java -version
          javac -version
          echo "========================"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Sign Android App Bundle (AAB)
        script: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB file not found!"
            exit 1
          fi

          KEYSTORE=""
          if [ -n "$CM_KEYSTORE_PATH" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            KEYSTORE="$CM_KEYSTORE_PATH"
          elif [ -n "$CM_KEYSTORE" ]; then
            KEYSTORE="/tmp/release.keystore"
            echo "$CM_KEYSTORE" | base64 --decode > "$KEYSTORE"
          fi

          if [ -z "$KEYSTORE" ] || [ ! -f "$KEYSTORE" ]; then
            echo "ERROR: Keystore is missing!"
            echo "Please provide CM_KEYSTORE_PATH or CM_KEYSTORE (base64) in Codemagic environment variables."
            exit 1
          fi

          if [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ]; then
            echo "ERROR: Required signing credentials missing!"
            echo "Please configure CM_KEYSTORE_PASSWORD and CM_KEY_ALIAS in Codemagic secure environment variables."
            exit 1
          fi

          KEY_PASS="${CM_KEY_PASSWORD:-$CM_KEYSTORE_PASSWORD}"

          echo "Signing AAB: $AAB_FILE"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASS" \
            "$AAB_FILE" "$CM_KEY_ALIAS"

          echo "AAB Successfully Signed!"
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - free122055@gmail.com
