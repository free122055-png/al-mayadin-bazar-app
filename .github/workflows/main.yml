name: Build Signed Android AAB (Google Play)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build & Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Ensure Keystore Exists
        run: |
          if [ -f "android/app/release.keystore" ]; then
            echo "Keystore is ready"
          elif [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Signed Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: almayadin-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
