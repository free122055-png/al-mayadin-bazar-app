name: Build Signed Android AAB (Google Play)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build & Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Keystore and Verify
        run: |
          echo "Checking keystore location..."
          if [ -f "android/app/release.keystore" ]; then
            echo "Keystore found at android/app/release.keystore"
          elif [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
            echo "Copied root release.keystore to android/app/"
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "Decoded keystore from GitHub secrets!"
          else
            echo "WARNING: No release.keystore file found in repo."
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Sign AAB with jarsigner if Keystore Available
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "ERROR: Release AAB file not found!"
            exit 1
          fi
          echo "Generated AAB found: $AAB_FILE"

          KEYSTORE="android/app/release.keystore"
          if [ -f "$KEYSTORE" ]; then
            echo "Signing with jarsigner..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KEYSTORE" \
              -storepass "almayadin123" \
              -keypass "almayadin123" \
              "$AAB_FILE" "almayadin"
            echo "AAB signing complete!"
          else
            echo "Keystore not present; bundle built with Gradle default config."
          fi

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: almayadin-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
