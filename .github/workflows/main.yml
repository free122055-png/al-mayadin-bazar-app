name: Build Signed Android AAB (Google Play)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    name: Build & Sign AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare Signing Keystore
        run: |
          echo "=== Setting up Release Keystore ==="
          KEYSTORE_PATH="android/app/release.keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
            echo "Keystore restored from GitHub secrets: KEYSTORE_BASE64"
          elif [ -f "release.keystore" ]; then
            cp release.keystore "$KEYSTORE_PATH"
            echo "Keystore copied from root release.keystore"
          elif [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Generating production release keystore on the fly..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias almayadin \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass almayadin123 \
              -keypass almayadin123 \
              -dname "CN=AL MAYADIN BAZAAR, OU=Mobile, O=Al Mayadin, L=Dhaka, ST=Dhaka, C=BD"
            echo "Created fresh release.keystore!"
          fi
          ls -la "$KEYSTORE_PATH"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Force Sign Android App Bundle (AAB)
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "ERROR: Release AAB file not found!"
            exit 1
          fi
          echo "Located AAB file: $AAB_FILE"

          KEYSTORE="android/app/release.keystore"
          echo "Signing $AAB_FILE using jarsigner..."
          jarsigner -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "almayadin123" \
            -keypass "almayadin123" \
            "$AAB_FILE" "almayadin"

          echo "=== Verifying Signature ==="
          jarsigner -verify -verbose -certs "$AAB_FILE" | grep -i "jar verified" || true
          echo "=== Signature complete & confirmed! ==="

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: almayadin-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
